name: Déploiement Infomaniak

# Construit l'app et envoie le dossier dist/ sur l'hébergement Infomaniak.
# Secrets GitHub (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  clés publiques de Supabase, intégrées à la compilation
#                                               (au choix: secrets OU variables GitHub, ce ne sont pas des secrets)
# Envoi par FTP (recommandé: mêmes identifiants que l'envoi manuel):
#   FTP_HOST, FTP_USER, FTP_PASSWORD            serveur et compte FTP (Manager Infomaniak → FTP / SSH)
#   FTP_PATH                                    dossier du site, vu depuis ce compte FTP (ex. /sites/budgetbloom.ciaoprimo.fr/)
# Ou envoi par SSH (si les secrets FTP sont absents):
#   SSH_HOST, SSH_USER, SSH_PATH, SSH_KEY       connexion SSH et clé privée dédiée
# Sans ces secrets, le déploiement est ignoré (le build est quand même vérifié).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Vérifier les secrets de déploiement
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing() { local m=""; for name in "$@"; do [ -z "${!name}" ] && m="$m $name"; done; echo "$m"; }
          if [ -n "$(missing SUPABASE_URL SUPABASE_ANON_KEY)" ]; then
            echo "Secrets manquants:$(missing SUPABASE_URL SUPABASE_ANON_KEY) -> déploiement ignoré."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          elif [ -n "$FTP_HOST$FTP_USER$FTP_PASSWORD$FTP_PATH" ]; then
            if [ -n "$(missing FTP_HOST FTP_USER FTP_PASSWORD FTP_PATH)" ]; then
              echo "::error::Secrets FTP incomplets:$(missing FTP_HOST FTP_USER FTP_PASSWORD FTP_PATH)"
              exit 1
            fi
            if [ "${FTP_PATH}" = "/" ] || [ "${FTP_PATH}" = "." ] || [ "${FTP_PATH}" = "./" ]; then
              echo "::error::FTP_PATH ne doit pas être la racine: indiquez le dossier du site."
              exit 1
            fi
            echo "Envoi par FTP vers ${FTP_HOST}."
            echo "mode=ftp" >> "$GITHUB_OUTPUT"
          elif [ -z "$(missing SSH_HOST SSH_USER SSH_PATH SSH_KEY)" ]; then
            if [ "${SSH_PATH}" = "/" ] || [ "${SSH_PATH}" = "~" ] || [ "${SSH_PATH}" = "." ]; then
              echo "::error::SSH_PATH ne doit pas être la racine ou le dossier personnel: choisissez le dossier du site."
              exit 1
            fi
            echo "Envoi par SSH vers ${SSH_HOST}."
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
          else
            echo "Ni secrets FTP ni secrets SSH complets -> déploiement ignoré."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      # FTP chiffré (FTPS). Le dossier distant se termine par « / ». L'action garde un petit fichier
      # d'état sur le serveur pour n'envoyer ensuite que les fichiers modifiés; elle n'efface que
      # des fichiers qu'elle a elle-même envoyés.
      - name: Envoyer le site (FTP)
        if: steps.check.outputs.mode == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ endsWith(secrets.FTP_PATH, '/') && secrets.FTP_PATH || format('{0}/', secrets.FTP_PATH) }}

      - name: Configurer SSH
        if: steps.check.outputs.mode == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Windows enregistre les clés avec des fins de ligne CRLF, que Linux refuse: on les retire.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "Empreinte de la clé contenue dans le secret SSH_KEY (à comparer avec celle de votre fichier .pub):"
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "::error::SSH_KEY est illisible: collez la clé privée complète (BEGIN ... END)."; exit 1; }
          echo "Test de connexion en tant que ${SSH_USER}..."
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "${SSH_USER}@${SSH_HOST}" 'echo connexion-ok'; then
            echo "::error::Le serveur refuse la clé. La clé publique correspondante n'est pas autorisée pour cet utilisateur chez Infomaniak."
            exit 1
          fi

      # Pas de --delete: on n'efface jamais rien sur le serveur (une erreur de chemin ne peut pas vider un dossier).
      - name: Envoyer le site (SSH)
        if: steps.check.outputs.mode == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          rsync -rltvz -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes" dist/ "${SSH_USER}@${SSH_HOST}:${SSH_PATH%/}/"
