<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F4ED" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Budget Bloom</title>
    <script>
      // Thème forcé (clair/sombre) appliqué avant tout affichage, sans flash.
      try {
        var m = localStorage.getItem('bloomTheme')
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m)
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Filtre « aquarelle » (bord irrégulier) utilisé par le bouton rond « + ». -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <!-- Écran de démarrage affiché avant le chargement de l'app (remplacé par React au démarrage). -->
    <div id="root">
      <div class="boot" style="min-height: 100dvh; display: grid; place-items: center">
        <img
          src="/favicon.svg"
          alt=""
          width="80"
          height="80"
          style="border-radius: 22px; box-shadow: 0 10px 24px -8px rgb(228 106 158 / 0.35); animation: breathe 2.4s ease-in-out infinite"
        />
      </div>
    </div>
    <style>
      .boot { background: #f8f4ed; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot { background: #18161b; } }
      :root[data-theme='dark'] .boot { background: #18161b; }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root img { animation: none !important; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
